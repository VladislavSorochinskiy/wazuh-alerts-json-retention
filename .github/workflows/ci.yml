name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate shell syntax
        run: |
          bash -n bin/wazuh-alerts-retention
          bash -n install.sh
          bash -n uninstall.sh
          bash -n tests/test-retention.sh

      - name: Run ShellCheck
        run: |
          shellcheck \
            bin/wazuh-alerts-retention \
            install.sh \
            uninstall.sh \
            tests/test-retention.sh

      - name: Run functional tests
        run: bash tests/test-retention.sh

      - name: Validate systemd units
        run: |
          sudo install -D -m 0750 \
            bin/wazuh-alerts-retention \
            /usr/local/sbin/wazuh-alerts-retention
          sudo install -D -m 0644 \
            config/wazuh-alerts-retention \
            /etc/default/wazuh-alerts-retention
          sudo systemd-analyze verify \
            systemd/wazuh-alerts-retention.service \
            systemd/wazuh-alerts-retention.timer
