# One-file bootstrap and CI workflow for wazuh-alerts-retention.
# Save this file in a new empty GitHub repository as:
# .github/workflows/ci.yml
#
# On the first run it validates and commits the complete repository structure.
# On later pushes and pull requests it runs the normal validation suite.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap repository
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate and commit repository on first run
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f README.md && -f VERSION && -x bin/wazuh-alerts-retention ]]; then
              echo 'Repository is already initialized; bootstrap is not required.'
              exit 0
          fi

          mapfile -t tracked_files < <(git ls-files)
          if (( ${#tracked_files[@]} != 1 )) || \
             [[ "${tracked_files[0]:-}" != '.github/workflows/ci.yml' ]]; then
              echo '::error::Bootstrap requires a new repository containing only .github/workflows/ci.yml.'
              printf 'Tracked files:\n'
              printf '  %s\n' "${tracked_files[@]}"
              exit 1
          fi

          archive="$RUNNER_TEMP/wazuh-alerts-retention-v1.0.0.tar.gz"

