          if [[ -n "$unsafe_entry" ]]; then
              echo '::error::Embedded archive contains an unsafe path.'
              printf '%s\n' "$unsafe_entry" >&2
              exit 1
          fi

          tar -xzf "$archive" --directory . --no-same-owner

          chmod 0755 \
              bin/wazuh-alerts-retention \
              install.sh \
              uninstall.sh \
              tests/test-retention.sh

          bash -n bin/wazuh-alerts-retention
          bash -n install.sh
          bash -n uninstall.sh
          bash -n tests/test-retention.sh

          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck \
              bin/wazuh-alerts-retention \
              install.sh \
              uninstall.sh \
              tests/test-retention.sh

          bash tests/test-retention.sh

          sudo install -D -m 0750 \
              bin/wazuh-alerts-retention \
              /usr/local/sbin/wazuh-alerts-retention
          sudo install -D -m 0644 \
              config/wazuh-alerts-retention \
              /etc/default/wazuh-alerts-retention
          sudo systemd-analyze verify \
              systemd/wazuh-alerts-retention.service \
              systemd/wazuh-alerts-retention.timer

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all

          if git diff --cached --quiet; then
              echo 'No repository files needed to be committed.'
              exit 0
          fi

          git commit -m 'Initial release: Wazuh alerts retention v1.0.0'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect initialized repository
        id: repository
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f README.md && -f VERSION && -x bin/wazuh-alerts-retention ]]; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              echo 'Repository files are not present in this commit; the bootstrap job handles the initial commit.'
          fi

      - name: Install ShellCheck
        if: steps.repository.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate shell syntax
        if: steps.repository.outputs.ready == 'true'
        run: |
          bash -n bin/wazuh-alerts-retention
          bash -n install.sh
          bash -n uninstall.sh
          bash -n tests/test-retention.sh

      - name: Run ShellCheck
        if: steps.repository.outputs.ready == 'true'
        run: |
          shellcheck \
            bin/wazuh-alerts-retention \
            install.sh \
            uninstall.sh \
            tests/test-retention.sh

      - name: Run functional tests
        if: steps.repository.outputs.ready == 'true'
        run: bash tests/test-retention.sh

      - name: Validate systemd units
        if: steps.repository.outputs.ready == 'true'
        run: |
          sudo install -D -m 0750 \
            bin/wazuh-alerts-retention \
            /usr/local/sbin/wazuh-alerts-retention
          sudo install -D -m 0644 \
            config/wazuh-alerts-retention \
            /etc/default/wazuh-alerts-retention
          sudo systemd-analyze verify \
            systemd/wazuh-alerts-retention.service \
            systemd/wazuh-alerts-retention.timer
